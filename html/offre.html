<!doctype html>
<html lang="fr-CM">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offre WiFi · SpotManager</title>
  <link rel="stylesheet" href="../css/index.css">
  <style>
    .public-offer-page{width:min(680px,calc(100% - 32px));margin:clamp(2rem,10vh,6rem) auto}
    .public-offer-card{padding:clamp(1.5rem,5vw,2.5rem);border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
    .public-offer-brand{margin:0 0 1.5rem;color:var(--muted);font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .public-offer-card h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem)}
    .public-offer-price{margin:1.1rem 0;font-size:2.4rem;font-weight:800;color:var(--accent)}
    .public-offer-details{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 1.8rem}
    .public-offer-details span{padding:.5rem .7rem;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.88rem}
    .public-offer-error{color:var(--text)}
  </style>
</head>
<body>
  <header class="navbar">
    <div class="brand"><span class="brand-text">SpotManager</span></div>
    <a href="offres.html">Gérer les offres</a>
  </header>
  <main id="public-offer" class="public-offer-page" aria-live="polite">
    <article class="public-offer-card">
      <p class="public-offer-brand">Forfait WiFi</p>
      <h1>Chargement de l’offre…</h1>
    </article>
  </main>
  <script src="../js/public-offer.js"></script>
</body>
</html>
